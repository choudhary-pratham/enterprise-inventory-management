spring:
  application:
    name: enterprise-devpilot-management

  datasource:
    url: jdbc:postgresql://localhost:5432/devpilot
    username: postgres
    password: pratham

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    model:
      chat: google-genai

    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
